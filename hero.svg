<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-label="Soham Dalvi, CS student and builder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#222a33" stroke-width="1" opacity=".55"/></pattern>
  <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#0b0d10" stop-opacity="0"/><stop offset=".55" stop-color="#0b0d10" stop-opacity="0"/><stop offset="1" stop-color="#0b0d10" stop-opacity=".0"/></linearGradient>
  <radialGradient id="glow" cx="80%" cy="50%" r="55%"><stop offset="0" stop-color="#7cf2c4" stop-opacity=".14"/><stop offset="1" stop-color="#7cf2c4" stop-opacity="0"/></radialGradient>
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .trace{fill:none;stroke:#222a33;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .pulse{fill:none;stroke:#7cf2c4;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:36 600;animation:run 5s linear infinite}
    .p2{animation-delay:-1.6s} .p3{animation-delay:-3.2s}
    @keyframes run{from{stroke-dashoffset:636}to{stroke-dashoffset:0}}
    .dot{animation:blink 1.8s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    .cur{animation:blink 1s steps(1) infinite}
  </style>
</defs>
<rect width="1200" height="380" rx="20" fill="#0b0d10"/>
<rect width="1200" height="380" rx="20" fill="url(#g)"/>
<rect width="1200" height="380" rx="20" fill="url(#glow)"/>
<!-- circuit traces -->
<g>
  <path id="a" class="trace" d="M640 70H760L800 110H980L1010 80H1160"/>
  <path id="b" class="trace" d="M700 190H830L860 220H1060L1090 190H1160"/>
  <path id="c" class="trace" d="M660 310H790L830 270H950L980 300H1160"/>
  <path class="pulse" d="M640 70H760L800 110H980L1010 80H1160"/>
  <path class="pulse p2" d="M700 190H830L860 220H1060L1090 190H1160"/>
  <path class="pulse p3" d="M660 310H790L830 270H950L980 300H1160"/>
  <g fill="#0b0d10" stroke="#222a33" stroke-width="2">
    <circle cx="800" cy="110" r="6"/><circle cx="980" cy="110" r="6"/><circle cx="860" cy="220" r="6"/>
    <circle cx="1060" cy="220" r="6"/><circle cx="830" cy="270" r="6"/><circle cx="950" cy="270" r="6"/>
  </g>
  <!-- chip -->
  <g transform="translate(900 135)">
    <rect width="110" height="70" rx="8" fill="#11151a" stroke="#7cf2c4" stroke-opacity=".6" stroke-width="1.5"/>
    <text x="55" y="42" text-anchor="middle" class="m" font-size="16" fill="#7cf2c4">C++</text>
  </g>
</g>
<!-- status pill -->
<g transform="translate(64 62)">
  <rect width="214" height="32" rx="16" fill="#11151a" stroke="#222a33"/>
  <circle class="dot" cx="20" cy="16" r="5" fill="#7cf2c4"/>
  <text x="36" y="21" class="m" font-size="13" fill="#8b95a1" letter-spacing="1.2">BUILDING &amp; LEARNING</text>
</g>
<text x="64" y="188" class="t" font-size="84" font-weight="700" fill="#f2f4f7" letter-spacing="-3">Soham Dalvi</text>
<text x="66" y="236" class="m" font-size="21" fill="#7cf2c4">CS student<tspan fill="#8b95a1"> / </tspan>builder<tspan fill="#8b95a1"> / </tspan>problem solver<tspan class="cur" fill="#7cf2c4">_</tspan></text>
<text x="66" y="292" class="t" font-size="19" fill="#8b95a1">Software, embedded hardware and the web.</text>
<text x="66" y="320" class="t" font-size="19" fill="#8b95a1">I document what I learn along the way.</text>
</svg>