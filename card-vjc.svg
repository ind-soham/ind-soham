<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img" aria-label="VJC Event Platform" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><style>.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dot{animation:b 1.8s ease-in-out infinite}@keyframes b{0%,100%{opacity:1}50%{opacity:.25}}
.k{animation:k 3s ease-in-out infinite}@keyframes k{0%,100%{fill-opacity:.0}50%{fill-opacity:.35}}
.w{animation:w 2.4s ease-out infinite;transform-origin:center}@keyframes w{0%{opacity:.9}100%{opacity:0}}
.l{animation:l 3.2s linear infinite}@keyframes l{0%,100%{fill-opacity:.1}50%{fill-opacity:1}}
.s{stroke-dasharray:6 8;animation:s 2s linear infinite}@keyframes s{to{stroke-dashoffset:-28}}</style></defs>
<rect x=".5" y=".5" width="559" height="299" rx="18" fill="#11151a" stroke="#222a33"/>
<text x="32" y="48" class="m" font-size="12" letter-spacing="1.4" fill="#7cf2c4">WEB / DEPLOYED</text>
<g transform="translate(528 40)" text-anchor="end"><text class="m" font-size="11" fill="#8b95a1" letter-spacing="1">LIVE</text></g>
<text x="32" y="84" class="t" font-size="28" font-weight="700" fill="#f2f4f7" letter-spacing="-.5">VJC Event Platform</text>
<text x="32" y="112" class="t" font-size="15.5" fill="#8b95a1">A static, lightweight event site built to load</text><text x="32" y="136" class="t" font-size="15.5" fill="#8b95a1">quickly on ordinary mobile networks under</text><text x="32" y="160" class="t" font-size="15.5" fill="#8b95a1">heavy traffic. No server-side rendering,</text><text x="32" y="184" class="t" font-size="15.5" fill="#8b95a1">deployed on GitHub Pages.</text>
<rect x="32" y="250" width="63" height="26" rx="13" fill="none" stroke="#222a33"/><text x="43" y="267" class="m" font-size="12" fill="#8b95a1">HTML5</text><rect x="103.0" y="250" width="55" height="26" rx="13" fill="none" stroke="#222a33"/><text x="114.0" y="267" class="m" font-size="12" fill="#8b95a1">CSS3</text><rect x="165.8" y="250" width="120" height="26" rx="13" fill="none" stroke="#222a33"/><text x="176.8" y="267" class="m" font-size="12" fill="#8b95a1">GitHub Pages</text>
<rect x="388" y="130" width="140" height="100" rx="10" fill="none" stroke="#222a33" stroke-width="1.5"/>
