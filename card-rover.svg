<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img" aria-label="Bluetooth Rover" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><style>.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dot{animation:b 1.8s ease-in-out infinite}@keyframes b{0%,100%{opacity:1}50%{opacity:.25}}
.k{animation:k 3s ease-in-out infinite}@keyframes k{0%,100%{fill-opacity:.0}50%{fill-opacity:.35}}
.w{animation:w 2.4s ease-out infinite;transform-origin:center}@keyframes w{0%{opacity:.9}100%{opacity:0}}
.l{animation:l 3.2s linear infinite}@keyframes l{0%,100%{fill-opacity:.1}50%{fill-opacity:1}}
.s{stroke-dasharray:6 8;animation:s 2s linear infinite}@keyframes s{to{stroke-dashoffset:-28}}</style></defs>
<rect x=".5" y=".5" width="559" height="299" rx="18" fill="#11151a" stroke="#222a33"/>
<text x="32" y="48" class="m" font-size="12" letter-spacing="1.4" fill="#7cf2c4">EMBEDDED / C++</text>
<g transform="translate(528 40)" text-anchor="end"><text class="m" font-size="11" fill="#8b95a1" letter-spacing="1">COMPLETED</text></g>
<text x="32" y="84" class="t" font-size="28" font-weight="700" fill="#f2f4f7" letter-spacing="-.5">Bluetooth Rover</text>
<text x="32" y="112" class="t" font-size="15.5" fill="#8b95a1">Bluetooth-controlled vehicle with a hardware</text><text x="32" y="136" class="t" font-size="15.5" fill="#8b95a1">safety override: an ultrasonic sensor stops</text><text x="32" y="160" class="t" font-size="15.5" fill="#8b95a1">the motors at 20 cm, so user error never</text><text x="32" y="184" class="t" font-size="15.5" fill="#8b95a1">becomes a collision.</text>
<rect x="32" y="250" width="47" height="26" rx="13" fill="none" stroke="#222a33"/><text x="43" y="267" class="m" font-size="12" fill="#8b95a1">C++</text><rect x="86.6" y="250" width="79" height="26" rx="13" fill="none" stroke="#222a33"/><text x="97.6" y="267" class="m" font-size="12" fill="#8b95a1">Arduino</text><rect x="174.0" y="250" width="79" height="26" rx="13" fill="none" stroke="#222a33"/><text x="185.0" y="267" class="m" font-size="12" fill="#8b95a1">HC-SR04</text><rect x="261.4" y="250" width="63" height="26" rx="13" fill="none" stroke="#222a33"/><text x="272.4" y="267" class="m" font-size="12" fill="#8b95a1">L298N</text>
<rect x="400" y="170" width="64" height="30" rx="8" fill="none" stroke="#8b95a1" stroke-width="1.5"/>
<circle cx="414" cy="206" r="7" fill="#11151a" stroke="#8b95a1" stroke-width="1.5"/><circle cx="450" cy="206" r="7" fill="#11151a" stroke="#8b95a1" stroke-width="1.5"/>
<rect x="462" y="178" width="10" height="14" rx="2" fill="#7cf2c4"/>
<path class="w" d="M482 172q14 7 0 14" fill="none" stroke="#7cf2c4" stroke-width="2" stroke-linecap="round"/>
<path class="w" style="animation-delay:-.8s" d="M492 166q22 13 0 26" fill="none" stroke="#7cf2c4" stroke-width="2" stroke-linecap="round"/>
<path class="w" style="animation-delay:-1.6s" d="M502 160q30 19 0 38" fill="none" stroke="#7cf2c4" stroke-width="2" stroke-linecap="round"/>
<line x1="472" y1="226" x2="520" y2="226" stroke="#8b95a1"/><text x="496" y="244" text-anchor="middle" class="m" font-size="11" fill="#8b95a1">20 cm</text>
<text x="432" y="130" text-anchor="middle" class="m" font-size="11" fill="#8b95a1">UART</text>
<line class="s" x1="404" y1="138" x2="460" y2="138" stroke="#7cf2c4" stroke-width="2"/>
</svg>