<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img" aria-label="Smart City Prototype" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><style>.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dot{animation:b 1.8s ease-in-out infinite}@keyframes b{0%,100%{opacity:1}50%{opacity:.25}}
.k{animation:k 3s ease-in-out infinite}@keyframes k{0%,100%{fill-opacity:.0}50%{fill-opacity:.35}}
.w{animation:w 2.4s ease-out infinite;transform-origin:center}@keyframes w{0%{opacity:.9}100%{opacity:0}}
.l{animation:l 3.2s linear infinite}@keyframes l{0%,100%{fill-opacity:.1}50%{fill-opacity:1}}
.s{stroke-dasharray:6 8;animation:s 2s linear infinite}@keyframes s{to{stroke-dashoffset:-28}}</style></defs>
<rect x=".5" y=".5" width="559" height="299" rx="18" fill="#11151a" stroke="#222a33"/>
<text x="32" y="48" class="m" font-size="12" letter-spacing="1.4" fill="#7cf2c4">ARDUINO / ENERGY</text>
<g transform="translate(528 40)" text-anchor="end"><text class="m" font-size="11" fill="#8b95a1" letter-spacing="1">COMPLETED</text></g>
<text x="32" y="84" class="t" font-size="28" font-weight="700" fill="#f2f4f7" letter-spacing="-.5">Smart City Prototype</text>
<text x="32" y="112" class="t" font-size="15.5" fill="#8b95a1">A scale model street that lights up from</text><text x="32" y="136" class="t" font-size="15.5" fill="#8b95a1">pedestrian kinetic energy. Piezo sensors</text><text x="32" y="160" class="t" font-size="15.5" fill="#8b95a1">drive six parallel LEDs for three seconds</text><text x="32" y="184" class="t" font-size="15.5" fill="#8b95a1">per footstep.</text>
<rect x="32" y="250" width="112" height="26" rx="13" fill="none" stroke="#222a33"/><text x="43" y="267" class="m" font-size="12" fill="#8b95a1">Arduino Uno</text><rect x="152.2" y="250" width="63" height="26" rx="13" fill="none" stroke="#222a33"/><text x="163.2" y="267" class="m" font-size="12" fill="#8b95a1">Piezo</text><rect x="223.2" y="250" width="71" height="26" rx="13" fill="none" stroke="#222a33"/><text x="234.2" y="267" class="m" font-size="12" fill="#8b95a1">Analog</text>
<line x1="410" y1="210" x2="410" y2="170" stroke="#8b95a1" stroke-width="1.5"/><circle class="l" style="animation-delay:-0.00s" cx="410" cy="166" r="6" fill="#7cf2c4"/><line x1="430" y1="210" x2="430" y2="170" stroke="#8b95a1" stroke-width="1.5"/><circle class="l" style="animation-delay:-0.35s" cx="430" cy="166" r="6" fill="#7cf2c4"/><line x1="450" y1="210" x2="450" y2="170" stroke="#8b95a1" stroke-width="1.5"/><circle class="l" style="animation-delay:-0.70s" cx="450" cy="166" r="6" fill="#7cf2c4"/><line x1="470" y1="210" x2="470" y2="170" stroke="#8b95a1" stroke-width="1.5"/><circle class="l" style="animation-delay:-1.05s" cx="470" cy="166" r="6" fill="#7cf2c4"/><line x1="490" y1="210" x2="490" y2="170" stroke="#8b95a1" stroke-width="1.5"/><circle class="l" style="animation-delay:-1.40s" cx="490" cy="166" r="6" fill="#7cf2c4"/><line x1="510" y1="210" x2="510" y2="170" stroke="#8b95a1" stroke-width="1.5"/><circle class="l" style="animation-delay:-1.75s" cx="510" cy="166" r="6" fill="#7cf2c4"/><line x1="396" y1="210" x2="534" y2="210" stroke="#8b95a1" stroke-width="1.5"/><rect x="440" y="218" width="40" height="10" rx="5" fill="none" stroke="#222a33"/><text x="460" y="248" text-anchor="middle" class="m" font-size="11" fill="#8b95a1">piezo</text>
</svg>