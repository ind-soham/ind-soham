<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img" aria-label="ZyDeck" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><style>.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dot{animation:b 1.8s ease-in-out infinite}@keyframes b{0%,100%{opacity:1}50%{opacity:.25}}
.k{animation:k 3s ease-in-out infinite}@keyframes k{0%,100%{fill-opacity:.0}50%{fill-opacity:.35}}
.w{animation:w 2.4s ease-out infinite;transform-origin:center}@keyframes w{0%{opacity:.9}100%{opacity:0}}
.l{animation:l 3.2s linear infinite}@keyframes l{0%,100%{fill-opacity:.1}50%{fill-opacity:1}}
.s{stroke-dasharray:6 8;animation:s 2s linear infinite}@keyframes s{to{stroke-dashoffset:-28}}</style></defs>
<rect x=".5" y=".5" width="559" height="299" rx="18" fill="#11151a" stroke="#222a33"/>
<text x="32" y="48" class="m" font-size="12" letter-spacing="1.4" fill="#7cf2c4">HARDWARE / FIRMWARE</text>
<g transform="translate(528 40)" text-anchor="end"><text class="m" font-size="11" fill="#8b95a1" letter-spacing="1">IN PROGRESS</text></g>
<text x="32" y="84" class="t" font-size="28" font-weight="700" fill="#f2f4f7" letter-spacing="-.5">ZyDeck</text>
<text x="32" y="112" class="t" font-size="15.5" fill="#8b95a1">A programmable macropad for the Hack Club</text><text x="32" y="136" class="t" font-size="15.5" fill="#8b95a1">Hackpad program. Custom PCB, QMK firmware</text><text x="32" y="160" class="t" font-size="15.5" fill="#8b95a1">and a 3D-printed case. Planned: 6 keys,</text><text x="32" y="184" class="t" font-size="15.5" fill="#8b95a1">rotary encoder, OLED, USB-C, RGB.</text>
<rect x="32" y="250" width="47" height="26" rx="13" fill="none" stroke="#222a33"/><text x="43" y="267" class="m" font-size="12" fill="#8b95a1">PCB</text><rect x="86.6" y="250" width="47" height="26" rx="13" fill="none" stroke="#222a33"/><text x="97.6" y="267" class="m" font-size="12" fill="#8b95a1">QMK</text><rect x="141.2" y="250" width="55" height="26" rx="13" fill="none" stroke="#222a33"/><text x="152.2" y="267" class="m" font-size="12" fill="#8b95a1">Vial</text><rect x="204.0" y="250" width="47" height="26" rx="13" fill="none" stroke="#222a33"/><text x="215.0" y="267" class="m" font-size="12" fill="#8b95a1">CAD</text>
<rect class="k" style="animation-delay:-0.0s" x="410" y="150" width="36" height="36" rx="8" fill="#7cf2c4" fill-opacity="0" stroke="#7cf2c4" stroke-opacity=".7"/><rect class="k" style="animation-delay:-0.5s" x="454" y="150" width="36" height="36" rx="8" fill="#7cf2c4" fill-opacity="0" stroke="#7cf2c4" stroke-opacity=".7"/><rect class="k" style="animation-delay:-1.0s" x="498" y="150" width="36" height="36" rx="8" fill="#7cf2c4" fill-opacity="0" stroke="#7cf2c4" stroke-opacity=".7"/><rect class="k" style="animation-delay:-1.5s" x="410" y="194" width="36" height="36" rx="8" fill="#7cf2c4" fill-opacity="0" stroke="#7cf2c4" stroke-opacity=".7"/><rect class="k" style="animation-delay:-2.0s" x="454" y="194" width="36" height="36" rx="8" fill="#7cf2c4" fill-opacity="0" stroke="#7cf2c4" stroke-opacity=".7"/><rect class="k" style="animation-delay:-2.5s" x="498" y="194" width="36" height="36" rx="8" fill="#7cf2c4" fill-opacity="0" stroke="#7cf2c4" stroke-opacity=".7"/><circle cx="388" cy="108" r="0"/><circle cx="500" cy="118" r="16" fill="none" stroke="#8b95a1" stroke-width="1.5"/><line x1="500" y1="118" x2="500" y2="106" stroke="#7cf2c4" stroke-width="2" stroke-linecap="round"/><rect x="410" y="102" width="56" height="28" rx="4" fill="none" stroke="#222a33"/><text x="438" y="121" text-anchor="middle" class="m" font-size="10" fill="#8b95a1">OLED</text>
